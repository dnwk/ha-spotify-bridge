---
name: Build images

# Builds the app image for each architecture on a native runner (no QEMU:
# librespot is compiled from source) and pushes it to GHCR as
#   ghcr.io/<owner>/<arch>-spotify-bridge:<version from config.yaml>
# Home Assistant pulls these (config.yaml `image:`) instead of building locally.
on:
  push:
    branches: [bridge]
    paths:
      - "spotify_bridge/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and base image
        id: info
        run: |
          version="$(sed -n 's/^version: *//p' spotify_bridge/config.yaml | tr -d "\"' ")"
          base="$(sed -n 's/^  ${{ matrix.arch }}: *//p' spotify_bridge/build.yaml | tr -d ' ')"
          test -n "$version" && test -n "$base"
          {
            echo "version=$version"
            echo "base=$base"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-spotify-bridge"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: spotify_bridge
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.info.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.info.outputs.version }}
            BUILD_DATE=${{ steps.info.outputs.date }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_NAME=Spotify Bridge
            BUILD_DESCRIPTION=Spotify Connect device that plays through Music Assistant speakers
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
