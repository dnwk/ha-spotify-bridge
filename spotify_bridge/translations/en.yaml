---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the app provides.
  name:
    name: Name
    description: >-
      The name of your device (the Spotify Connect target), as shown on
      the official Spotify clients.
  bitrate:
    name: Bitrate
    description: >-
      The bitrate Spotify should use. The higher, the better the sound quality,
      however, the app consumes more data.
  initial_volume:
    name: Initial Volume
    description: >-
      Initial volume in % from 0-100.
  autoplay:
    name: Autoplay
    description: >-
      Whether Spotify should autoplay similar songs at the end of the queue.
  access_token:
    name: Access token
    description: >-
      Optional. Only needed if you cannot pick the device in the Spotify app on
      your network. See the librespot documentation.
  music_assistant_url:
    name: Music Assistant Sendspin URL
    description: >-
      Where Music Assistant's Sendspin server listens. The default works when
      Music Assistant runs as an app on this Home Assistant.
  sendspin_name:
    name: Music Assistant input name
    description: >-
      Name of the Live Input in Music Assistant. Default: "Spotify (<Name>)".
  pairing_code:
    name: Pairing code
    description: >-
      Optional 8-digit code you type into Music Assistant when pairing. Leave
      empty to get a one-time 6-digit code as a Home Assistant notification.
  volume_sync:
    name: Spotify volume controls the speaker
    description: >-
      Moving the volume slider in the Spotify app sets the volume of the
      speaker that plays it. The speaker's own volume is kept when you first
      pick the device.
  speaker_select:
    name: Speaker select entity
    description: >-
      Adds a "Speaker" select entity (via MQTT) to choose where Spotify plays.
      When a speaker is chosen there, set "Automatically play line-in on" to
      Off in Music Assistant.
