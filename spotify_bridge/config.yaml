---
name: Spotify Bridge
version: 0.1.0
slug: spotify_bridge
description: Spotify Connect device that plays through Music Assistant speakers (fork of the Spotify Connect app)
url: https://github.com/dnwk/ha-spotify-bridge
# Prebuilt by GitHub Actions (.github/workflows/build.yaml); HA pulls instead of compiling.
image: ghcr.io/dnwk/{arch}-spotify-bridge
arch:
  - aarch64
  - amd64
host_network: true
# Used to show the Music Assistant pairing code as a Home Assistant notification.
homeassistant_api: true
# MQTT broker details (Mosquitto) for the Speaker select entity; optional.
services:
  - mqtt:want
init: false
options:
  name: Home Assistant
  bitrate: 160
  initial_volume: 50
  autoplay: true
  access_token: ""
  music_assistant_url: ws://localhost:8927/sendspin
  volume_sync: true
  speaker_select: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  name: str
  bitrate: list(96|160|320)
  autoplay: bool
  initial_volume: match(^([0-9]|[1-9][0-9]|100)$)?
  access_token: str
  music_assistant_url: str
  sendspin_name: str?
  pairing_code: match(^([0-9]{4}[- ]?[0-9]{4})?$)?
  volume_sync: bool
  speaker_select: bool
