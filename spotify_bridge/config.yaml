---
name: Spotify Bridge
version: dev
slug: spotify_bridge
description: Spotify Connect device that plays through Music Assistant speakers (fork of the Spotify Connect app)
url: https://github.com/dnwk/ha-spotify-bridge
arch:
  - aarch64
  - amd64
host_network: true
audio: true
init: false
options:
  name: Home Assistant
  bitrate: 160
  initial_volume: 50
  autoplay: true
  access_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  name: str
  bitrate: list(96|160|320)
  autoplay: bool
  initial_volume: match(^([0-9]|[1-9][0-9]|100)$)?
  access_token: str
